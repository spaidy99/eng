<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مختصر النصوص الاحترافي</title>
    <!-- استيراد خط عربي جميل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 600px;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
            color: #38bdf8;
        }

        p.subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #e2e8f0;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            background: #0f172a;
            border: 2px solid #334155;
            color: #fff;
            border-radius: 12px;
            font-size: 16px;
            resize: none;
            transition: all 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        button.action-btn {
            width: 100%;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
        }

        button.action-btn:hover {
            background: linear-gradient(135deg, #0369a1, #075985);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
        }

        .result-box {
            margin-top: 30px;
            background: #0f172a;
            border: 2px dashed #334155;
            padding: 20px;
            border-radius: 12px;
            position: relative;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .result-title {
            font-size: 14px;
            color: #38bdf8;
            font-weight: 600;
        }

        .copy-btn {
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .copy-btn:hover {
            background: #38bdf8;
            color: #0f172a;
        }

        #outputText {
            font-size: 18px;
            color: #f1f5f9;
            word-break: break-word;
            min-height: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>مختصر النصوص الذكي</h2>
        <p class="subtitle">أدخل جملتك، وسيتم اختصار العبارات الشهيرة مع الحفاظ على البقية وتوفير زر نسخ فوري.</p>

        <div class="input-group">
            <label for="inputText">النص الأصلي:</label>
            <textarea id="inputText" placeholder="اكتب جملتك هنا... (مثال: What about you)"></textarea>
        </div>

        <button class="action-btn" onclick="processText()">اختصار النص</button>

        <div class="result-box">
            <div class="result-header">
                <div class="result-title">النص بعد الاختصار:</div>
                <button class="copy-btn" id="copyBtn" onclick="copyResult()" style="display: none;">
                    📋 نسخ الكل
                </button>
            </div>
            <div id="outputText">---</div>
        </div>
    </div>

    <script>
        // قاموس العبارات والاختصارات الشهيرة
        const abbreviations = {
            "what about you": "wbu",
            "see you later": "cya",
            "laugh out loud": "lol",
            "by the way": "btw",
            "to be honest": "tbh",
            "oh my god": "omg",
            "in my opinion": "imo",
            "as soon as possible": "asap",
            "are you serious": "ays",
            "for your information": "fyi",
            "don't worry": "dw",
            "good night": "gn",
            "thank you": "ty"
        };

        function processText() {
            let text = document.getElementById("inputText").value;
            const outputElement = document.getElementById("outputText");
            const copyBtn = document.getElementById("copyBtn");
            
            if (!text.trim()) {
                outputElement.innerText = "الرجاء إدخال نص أولاً!";
                copyBtn.style.display = "none";
                return;
            }

            // البحث عن العبارات واستبدالها مع مراعاة تجاهل حالة الأحرف
            for (let phrase in abbreviations) {
                let regex = new RegExp(phrase, "gi");
                text = text.replace(regex, abbreviations[phrase]);
            }

            // عرض النص المختصر وإظهار زر النسخ
            outputElement.innerText = text;
            copyBtn.style.display = "flex";
        }

        function copyResult() {
            const outputText = document.getElementById("outputText").innerText;
            const copyBtn = document.getElementById("copyBtn");

            // نسخ النص إلى الحافظة
            navigator.clipboard.writeText(outputText).then(() => {
                let originalText = copyBtn.innerHTML;
                copyBtn.innerHTML = "✅ تم النسخ!";
                copyBtn.style.background = "#22c55e";
                copyBtn.style.color = "#fff";
                copyBtn.style.borderColor = "#22c55e";

                // إعادة الزر لحالته الأصلية بعد ثانيتين
                setTimeout(() => {
                    copyBtn.innerHTML = originalText;
                    copyBtn.style.background = "#1e293b";
                    copyBtn.style.color = "#38bdf8";
                    copyBtn.style.borderColor = "#38bdf8";
                }, 2000);
            });
        }
    </script>

</body>
  </html>
